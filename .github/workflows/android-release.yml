# Builds the shippable Android **release** APK from source and hands it back as a
# downloadable artifact — this is how you obtain an installable Choop APK from CI.
#
# It is deliberately anonymity-safe and needs NOTHING from the repository owner to run:
#   • No secrets required. If no signing keystore is configured, the release build falls
#     back to the Android debug key (see android/app/build.gradle.kts), so `assembleFullRelease`
#     still produces an installable APK. A debug-key APK installs fine for personal/sideload use;
#     it is simply not the maintainer's official signature.
#   • A REAL signing key is used only if the maintainer adds the optional secrets below, so the
#     published `Choop-v*.apk` can be reproduced with the maintainer's identity when wanted:
#       ANDROID_KEYSTORE_BASE64   – base64 of the .jks keystore
#       ANDROID_KEYSTORE_PASSWORD – store password
#       ANDROID_KEY_ALIAS         – key alias
#       ANDROID_KEY_PASSWORD      – key password
#
# The CHANNEL IS DERIVED FROM WHERE YOU RUN, never chosen — that is what guarantees the invariant and
# makes stable/preview mixing impossible:
#
#   run on the DEFAULT branch (main)  ⇒ STABLE  (the real Choop app, com.kimchai.choop)
#   run on ANY OTHER branch           ⇒ PREVIEW (the side-by-side "Choop Preview", com.kimchai.choop.preview)
#
# A BRANCH RUN PUBLISHES A PRE-RELEASE. It is not just an artifact: it creates the `v<version>-pre`
# GitHub pre-release with the Preview APK attached, so "Check for updates" inside Choop Preview finds
# it and installs it in place. (An artifact can't be discovered by the app — it needs a login to
# download — which is why sideloading a branch build used to be a manual chore.) Channel isolation is
# unaffected and enforced on BOTH ends: pre-releases are excluded from GitHub's /releases/latest, which
# is all stable ever reads, and the preview app filters the release list to `prerelease == true`
# (UpdateCheck.newestPreviewRelease) — so stable finds only stable, preview finds only preview.
#
# So the everyday flow is exactly:
#   1. push a feature branch → dispatch here on that branch → a `v…-pre` PRE-RELEASE is published →
#      open Choop Preview → Settings → About → Check for updates → Update. Done, in the app.
#   2. like it → open a PR → merge to main.
#   3. on main → dispatch here (mode: release-auto) → cut the next STABLE release.
#
# Guard rails enforce this: a stable release mode is REJECTED on a branch (stable is cut from main
# only), so a branch can never become stable and main can never become preview.
#
# PREVIEW VERSIONING. A branch preview is versioned `<base>.<run#>`, where <base> is the highest
# version any published release carries (so it never sits below an older preview even when the branch
# lags main) and <run#> is the workflow run number, which only ever increases. That makes every
# preview strictly newer than the last one — the app compares versionName numerically — while still
# sorting BELOW the next stable patch (8.2.29.1234 < 8.2.30). versionCode gets the same treatment
# (1000 + run#) so Android never rejects the install as a downgrade.
#
# RELEASE NOTES are generated for every release (preview and stable) by tools/release-notes.py from the
# branch's PR (title + body) or, failing that, its commits. They are written INTO the app
# (AppChangelog.kt, so the Updates inbox and Settings → What's new show them) *before* the APK is
# built, and emitted as the GitHub release body (so "Check for updates" shows the same text).
#
# Triggers:
#   • workflow_dispatch – pick a `mode`:
#       build          – on a branch: publish the preview pre-release (the default, and the only
#                        thing a branch can do). On main: an artifact-only dry run, no tag/Release.
#       release-auto   – (main only) bump the build.gradle versionName by `bump`, commit it, tag it,
#                        cut the GitHub Release. No need to look up the last version.
#       release-manual – (main only) release at the exact numeric `version` you type.
#   • push of a version tag (v* / android-v*) – cut a Release for that tag (tags are stable; a
#     "-pre" tag also publishes a preview release).
name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = on a branch publish the preview pre-release (only option there); on main an artifact-only dry run. release-auto / release-manual = cut a STABLE release — MAIN ONLY.'
        type: choice
        default: build
        options:
          - build
          - release-auto
          - release-manual
      bump:
        description: 'release-auto only — which part of the version to increment.'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'release-manual only — numeric-only version like 8.3.0 (no leading "v"). Blank = keep current.'
        type: string
        default: ''
      build_demo:
        description: 'Also build the sample-data demo flavour (Choop demo APK).'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - 'android-v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # push the version-bump commit + create the tag/Release (release modes only)

jobs:
  release-apk:
    runs-on: ubuntu-latest
    # Mapped here because the `secrets` context can't be used in a step-level `if:` —
    # this lets the signing step below gate on presence via `env.HAS_KEYSTORE`.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Resolve the version, the CHANNEL (derived from the ref — never chosen), and whether this run
      # publishes a Release. This is the single place that enforces "main ⇒ stable, any branch ⇒
      # preview, releases from main only". Nothing here mutates the repo — the bump is a separate,
      # gated step.
      - name: Resolve version
        id: ver
        env:
          MODE: ${{ inputs.mode }}
          BUMP: ${{ inputs.bump }}
          MANUAL: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}   # for `gh release list` in highest_published_base
        run: |
          set -euo pipefail
          MODE="${MODE:-build}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          CUR=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CURCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)

          # The highest x.y.z any PUBLISHED release carries (stable or -pre), so a preview cut from a
          # branch that lags main still lands ABOVE the newest preview. Without this a branch at 8.2.20
          # would publish 8.2.20.<run> while the installed preview was already 8.2.29.<older run>, and
          # the app — which compares versionName numerically — would correctly call it "not newer" and
          # never offer it. Falls back to the branch's own version when the list is empty/unreachable.
          highest_published_base() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null \
              | awk '{print $1}' \
              | sed 's/^v//; s/-pre$//' \
              | grep -E '^[0-9]+(\.[0-9]+)*$' \
              | cut -d. -f1-3 \
              || true
          }

          bump_version() {
            IFS=. read -r MA MI PA <<< "$CUR"
            MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
            case "$BUMP" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            NEW="${MA}.${MI}.${PA}"; NEWCODE=$((CURCODE+1)); DO_BUMP=true; TAG="v${NEW}"; SUFFIX=""
          }
          manual_version() {
            NEW="${MANUAL:-$CUR}"
            # versionName must stay numeric-only — UpdateCheck.isNewer parses digits.
            if ! printf '%s' "$NEW" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
              echo "::error::version must be numeric-only like 8.3.0 (no leading 'v'). Got: '$NEW'"; exit 1
            fi
            if [ "$NEW" != "$CUR" ]; then NEWCODE=$((CURCODE+1)); DO_BUMP=true; else NEWCODE="$CURCODE"; DO_BUMP=false; fi
            TAG="v${NEW}"; SUFFIX=""
          }

          if [ "$EVENT" = "push" ]; then
            # A pushed tag is a release. Tags are STABLE (they're cut from main); a "-pre" tag is the
            # single escape hatch for publishing a PREVIEW release. Channel derives from the tag.
            if printf '%s' "$REF_NAME" | grep -q -- '-pre'; then CHANNEL=preview; else CHANNEL=stable; fi
            NEW="$CUR"; NEWCODE="$CURCODE"; DO_RELEASE=true; DO_BUMP=false; TAG="$REF_NAME"; SUFFIX=""

          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            # ── main ⇒ STABLE channel ──
            CHANNEL=stable
            case "$MODE" in
              build)         NEW="$CUR"; NEWCODE="$CURCODE"; DO_RELEASE=false; DO_BUMP=false; TAG=""; SUFFIX="-${GITHUB_SHA::7}" ;;
              release-auto)  bump_version;   DO_RELEASE=true ;;
              release-manual) manual_version; DO_RELEASE=true ;;
              *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
            esac

          else
            # ── any feature branch ⇒ PREVIEW channel, PUBLISHED AS A PRE-RELEASE ──
            # This is what makes a branch testable from inside the app: a pre-release is public, so
            # "Check for updates" in Choop Preview can find and install it. Stable can never see it —
            # GitHub keeps pre-releases out of /releases/latest, and the preview app additionally
            # filters to prerelease == true.
            CHANNEL=preview
            if [ "$MODE" != "build" ]; then
              echo "::error::STABLE releases are cut from '${DEFAULT_BRANCH}' only. You are on branch '${REF_NAME}', which always publishes a PREVIEW pre-release. Use mode=build here, then merge the PR and run release-auto on ${DEFAULT_BRANCH}."
              exit 1
            fi
            # <base>.<run#>: strictly increasing across every run and branch, and always below the
            # next stable patch. sort -V picks the highest base among the branch's own version and
            # every published release's.
            BASE=$(printf '%s\n' "$CUR" $(highest_published_base) | grep -E '^[0-9]' | sort -V | tail -1)
            BASE="${BASE:-$CUR}"
            NEW="${BASE}.${GITHUB_RUN_NUMBER}"
            NEWCODE=$((1000 + GITHUB_RUN_NUMBER))
            DO_RELEASE=true; DO_BUMP=false; TAG="v${NEW}-pre"; SUFFIX=""
          fi

          echo "Resolved: ref=$REF_NAME (default=$DEFAULT_BRANCH) version=$NEW code=$NEWCODE channel=$CHANNEL release=$DO_RELEASE bump=$DO_BUMP tag=${TAG:-<none>} suffix=${SUFFIX:-<none>}"
          {
            echo "new_version=$NEW"
            echo "new_code=$NEWCODE"
            echo "do_release=$DO_RELEASE"
            echo "do_bump=$DO_BUMP"
            echo "tag=$TAG"
            echo "suffix=$SUFFIX"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          # A short human summary in the run's Summary tab.
          {
            echo "### Android build"
            echo "- Mode: \`${MODE:-tag-push}\` · Channel: \`$CHANNEL\`"
            echo "- Version: \`$NEW\` (versionCode \`$NEWCODE\`)"
            echo "- Release: \`$DO_RELEASE\`${TAG:+ → tag \`$TAG\`}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Derive this release's notes and write them into BOTH places they have to appear, from one
      # source, so they can never disagree:
      #   • app/src/main/java/com/noop/ui/AppChangelog.kt  → compiled into the APK, so the Updates
      #     inbox row and Settings → About → "What's new" show them offline. Written BEFORE the build.
      #   • release-notes.md → the GitHub release body, which "Check for updates" reads live.
      # Source of the text, in order: the PR for this ref (title + its bullet lines), else the commit
      # subjects since the previous tag. On a stable release the changelog edit is committed by the
      # bump step below; on a preview it stays a build-time-only edit (the APK carries it, the branch
      # stays clean).
      - name: Generate release notes
        if: ${{ steps.ver.outputs.do_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.ver.outputs.new_version }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          set -euo pipefail
          TITLE=""
          # The OPEN PR whose head is this branch, if there is one. Restricted to --state open on
          # purpose: branch names get reused, and `gh pr view <branch>` happily resolves a long-MERGED
          # PR for the same name — which would stamp an old PR's title onto a brand-new release.
          PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REF_NAME" --state open \
            --limit 1 --json title,body --jq '.[0] // empty' 2>/dev/null || echo '')
          if [ -n "$PR_JSON" ]; then
            TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
            # Bullet lines from the PR body ("- x" / "* x"), markdown markers kept — the app renders
            # **bold** and the release page does too. Checkbox lines are template scaffolding, skipped.
            printf '%s' "$PR_JSON" | jq -r '.body // ""' \
              | grep -E '^[[:space:]]*[-*][[:space:]]+' \
              | grep -vE '^[[:space:]]*[-*][[:space:]]+\[[ xX]\]' \
              | sed -E 's/^[[:space:]]*[-*][[:space:]]+//' > items.txt || true
          fi
          if [ ! -s items.txt ]; then
            # No PR (or a PR with no bullets): fall back to commit subjects. Measure from the last
            # STABLE tag, not simply the last tag — every preview build publishes its own `-pre` tag,
            # so "since the last tag" would shrink to the single commit pushed since the previous
            # preview. What someone testing a preview actually wants is everything that is in it but
            # not yet in stable, which is exactly the range since the last stable release.
            PREV=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-pre' 2>/dev/null || echo '')
            RANGE="${PREV:+${PREV}..}HEAD"
            git log --no-merges --pretty=format:'%s' $RANGE | head -20 > items.txt || true
          fi
          # Title fallback: the newest commit subject reads far better in the Updates inbox row (which
          # shows the title alone) than a bare version string.
          [ -n "$TITLE" ] || TITLE=$(git log -1 --no-merges --pretty=format:'%s' || true)
          [ -n "$TITLE" ] || TITLE="Choop $NEW"
          # Drop any bullet that just repeats the title (the common single-commit case), so the notes
          # never render the same sentence twice.
          if [ -s items.txt ]; then
            grep -vxF "$TITLE" items.txt > items.trim.txt || true
            mv items.trim.txt items.txt
          fi
          echo "Release notes title: $TITLE"; echo "--- items ---"; cat items.txt || true
          python3 tools/release-notes.py \
            --version "$NEW" \
            --title "$TITLE" \
            --changelog app/src/main/java/com/noop/ui/AppChangelog.kt \
            --out-md release-notes.md < items.txt
          echo "--- release body ---"; cat release-notes.md

      # Only for a real release: write the new versionName/versionCode into build.gradle.kts and commit
      # the bump back to the branch you dispatched, so the tag, the Release and the APK's OWN version all
      # agree. Skipped entirely for `apk-only` (and for tag pushes), so design-iteration builds never
      # mutate the repo. Pushes use GITHUB_TOKEN, which does not re-trigger workflows (no build loop).
      - name: Bump version in source
        if: ${{ steps.ver.outputs.do_bump == 'true' }}
        env:
          NEW: ${{ steps.ver.outputs.new_version }}
          NEWCODE: ${{ steps.ver.outputs.new_code }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sed -i -E "s/(versionName[[:space:]]*=[[:space:]]*\")[^\"]+\"/\1${NEW}\"/" app/build.gradle.kts
          sed -i -E "s/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1${NEWCODE}/" app/build.gradle.kts
          echo "After bump:"; grep -nE 'versionName|versionCode' app/build.gradle.kts | head -3
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated changelog entry rides along on a STABLE release, so main permanently records
          # what shipped (a preview's entry stays build-time-only — see "Generate release notes").
          git add app/build.gradle.kts app/src/main/java/com/noop/ui/AppChangelog.kt
          git commit -m "Android: release v${NEW} (versionCode ${NEWCODE})"
          git push origin "HEAD:${BRANCH}"
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Optional real signing. When the secrets are absent (forks, no-secret runs) this step is a
      # no-op and the build transparently falls back to the debug key — the APK still installs.
      - name: Configure signing (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > noop-release.jks
          cat > keystore.properties <<EOF
          storeFile=noop-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # stable → the `full` flavor (com.kimchai.choop); preview → the `preview` flavor
      # (com.kimchai.choop.preview, label "Choop Preview"), which installs side-by-side.
      #
      # Preview builds override versionCode with 1000+<run#> (strictly increasing across ALL runs
      # and branches). That is what makes BRANCH previews installable: a feature branch usually
      # lags main's versionCode, and without the override Android would refuse the APK as a
      # downgrade over an already-installed Choop Preview. Stable never uses the override, so its
      # versionCode stays the deliberate build.gradle number.
      - name: Build release APK
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
          NEW: ${{ steps.ver.outputs.new_version }}
          NEWCODE: ${{ steps.ver.outputs.new_code }}
        run: |
          # Git provenance for the in-app build stamp (BuildConfig.GIT_SHA/GIT_BRANCH — shown in the
          # preview app's Today header so a screenshot answers "which build is this?").
          GITPROPS="-PchoopGitSha=${GITHUB_SHA::7} -PchoopGitBranch=${BRANCH}"
          if [ "$CHANNEL" = "preview" ]; then
            # The APK must carry the SAME version the pre-release is tagged with, or the app would
            # install v8.2.29.1234 and then still report the release as "available" forever.
            ./gradlew assemblePreviewRelease \
              -PchoopVersionNameOverride="$NEW" \
              -PchoopVersionCodeOverride="$NEWCODE" \
              $GITPROPS
          else
            ./gradlew assembleFullRelease $GITPROPS
          fi

      - name: Build demo release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_demo }}
        run: ./gradlew assembleDemoRelease

      # Collect the outputs under a versioned, published-asset name (Choop-v<versionName>.apk /
      # Choop-Preview-v<versionName>.apk), matching the upstream "NOOP-vX.Y.Z.apk" convention. The
      # exact name is exported as APK_NAME for the later cert-print and Release-upload steps.
      - name: Stage APKs
        env:
          VERSION: ${{ steps.ver.outputs.new_version }}
          SUFFIX: ${{ steps.ver.outputs.suffix }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "preview" ]; then
            APK="Choop-Preview-v${VERSION}${SUFFIX}.apk"
            SRC="app/build/outputs/apk/preview/release/app-preview-release.apk"
          else
            APK="Choop-v${VERSION}${SUFFIX}.apk"
            SRC="app/build/outputs/apk/full/release/app-full-release.apk"
          fi
          mkdir -p ../dist
          cp "$SRC" "../dist/$APK"
          if [ -f app/build/outputs/apk/demo/release/app-demo-release.apk ]; then
            cp app/build/outputs/apk/demo/release/app-demo-release.apk "../dist/Choop-v${VERSION}${SUFFIX}-demo.apk"
          fi
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"
          ls -l ../dist

      # Print the APK's signing certificate so you can confirm which key signed it. Compare the
      # "SHA-256 digest" printed here against your keystore's fingerprint
      # (keytool -list -v -keystore choop-release.jks). They match ⇒ CI signed with YOUR key;
      # if it instead shows the Android debug cert, the ANDROID_KEYSTORE_* secrets weren't picked up.
      # Informational only — never fails the build.
      - name: Print APK signing certificate
        run: |
          set +e
          echo "Keystore secret present (HAS_KEYSTORE): $HAS_KEYSTORE"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "../dist/$APK_NAME" | grep -i "SHA-256\|Signer"
          else
            echo "apksigner not found; skipping certificate print"
          fi

      # Name the artifact after the APK itself so the download is `<APK_NAME>.zip`
      # (e.g. Choop-v8.2.5.apk.zip, or Choop-v8.2.5-<sha>.apk.zip) instead of the generic
      # noop-android-apk.zip. GitHub always wraps artifacts in a zip named after the artifact; the
      # .apk inside keeps the same base name. APK_NAME is exported by the Stage APKs step above.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      # Publish (or update) a GitHub Release and attach the APK. Runs only when the resolved mode is a
      # release (release-auto / release-manual) or a version tag was pushed — never for `apk-only`. The
      # tag/Release is created if missing (CI creates the tag when dispatched) so it shows up under
      # /releases/latest, which the in-app "Check for updates" reads. Targets the bump commit when there
      # was one, else the checked-out SHA.
      - name: Publish APK to Release
        if: ${{ steps.ver.outputs.do_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          TARGET_SHA: ${{ env.BUMP_SHA || github.sha }}
        run: |
          echo "Publishing release $TAG at $TARGET_SHA (channel: $CHANNEL)"
          # Preview releases are marked PRE-RELEASE: GitHub's /releases/latest then excludes them,
          # so the stable app's update check never offers a preview build; the preview app reads the
          # full release list, keeps only prerelease == true, and picks them up.
          EXTRA=""
          FOOTER="Install $APK_NAME (updates in place over an existing Choop install signed with the same key)."
          if [ "$CHANNEL" = "preview" ]; then
            EXTRA="--prerelease"
            FOOTER="Choop PREVIEW channel build — installs side-by-side with stable Choop as \"Choop Preview\". Update from inside the app: Settings → About → Check for updates. Keep your strap paired to stable Choop; feed Preview via a .noopbak import (see android/MIGRATION.md)."
          fi
          # Body = the generated notes (the same text the app shows) + the install footer. The app's
          # cleanNotes() cuts at "Downloads", so the footer is separated by that heading and never
          # clutters the in-app update card.
          # Both files live in the job's working directory (android/), where the notes step wrote them.
          BODY_FILE=release-body.md
          if [ -f release-notes.md ]; then cp release-notes.md "$BODY_FILE"; else : > "$BODY_FILE"; fi
          printf '\n## Downloads\n\n%s\n' "$FOOTER" >> "$BODY_FILE"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$BODY_FILE" $EXTRA
          else
            gh release create "$TAG" --repo "$REPO" --target "$TARGET_SHA" --title "$TAG" $EXTRA \
              --notes-file "$BODY_FILE"
          fi
          gh release upload "$TAG" "../dist/$APK_NAME" --clobber --repo "$REPO"

      # Keep the release list readable: every branch build publishes a pre-release, so without pruning
      # they accumulate forever. Stable releases are NEVER touched — only `*-pre` tags, and only the
      # ones older than the newest few. The app is unaffected either way (it always takes the newest).
      - name: Prune old preview pre-releases
        if: ${{ steps.ver.outputs.do_release == 'true' && steps.ver.outputs.channel == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEEP=8
          # Newest-first by creation, pre-releases only, drop the ones past the keep window.
          OLD=$(gh release list --repo "$REPO" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease) ] | sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName")
          if [ -z "$OLD" ]; then echo "nothing to prune"; exit 0; fi
          echo "$OLD" | while read -r t; do
            [ -n "$t" ] || continue
            echo "pruning $t"
            gh release delete "$t" --repo "$REPO" --cleanup-tag --yes || true
          done